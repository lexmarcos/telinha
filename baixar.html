<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1430">
  <title>Baixar o Telinha</title>
  <meta name="description" content="Baixe o Telinha para Windows e Linux. O código é aberto, e o Telinha não grava a transmissão.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='18' rx='5' fill='%23cfe0ff'/%3E%3Ccircle cx='24' cy='11' r='2.4' fill='%23ff4438'/%3E%3Crect x='11' y='26' width='10' height='2.4' rx='1.2' fill='%23cfe0ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: auto; }
    /* The same dark room as the home screen, lit by the bubble. Everything fits one screen:
       the list of downloads opens over it, with a scroll of its own. */
    .download {
      --gap: clamp(0.875rem, 2.8dvh, 1.75rem);
      min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; gap: var(--gap);
      padding: max(3.25rem, calc(env(safe-area-inset-top) + 2.75rem)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: var(--room);
    }
    .back {
      position: fixed; z-index: 1; top: max(1rem, env(safe-area-inset-top)); left: max(1rem, env(safe-area-inset-left));
      display: inline-flex; align-items: center; gap: 0.25rem;
      min-height: 2.75rem; padding: 0 0.9rem 0 0.6rem; border-radius: 999px;
      color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.875rem;
      transition: color 160ms ease, background-color 160ms ease, transform 120ms ease-out;
    }
    .back:hover { color: var(--text); background: rgba(200, 212, 255, 0.08); }
    .back:active { transform: scale(0.96); transition-duration: 60ms; }

    /* The desktop app's bubble: a round tube that shows the version like a channel. */
    .bubble {
      position: relative; width: clamp(6rem, 20dvh, 10rem); aspect-ratio: 1; border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(70% 70% at 40% 35%, #1a2558 0%, #121a3d 100%);
      box-shadow:
        0 0 0 1.5px rgba(207, 224, 255, 0.45),
        0 0 140px 24px rgba(92, 128, 255, 0.2);
      animation: power-on 900ms var(--ease-out) 120ms both;
    }
    .bubble::before {
      /* tally light: this is the version on air */
      content: ""; position: absolute; top: 9%; right: 9%;
      width: 11%; aspect-ratio: 1; border-radius: 50%;
      background: var(--tally); box-shadow: 0 0 0 3px #121a3d, 0 0 14px rgba(255, 68, 56, 0.6);
    }
    .tube {
      width: 81%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
      display: grid; place-items: center;
      background:
        repeating-linear-gradient(to bottom, rgba(207, 224, 255, 0.035) 0 1px, transparent 1px 3px),
        radial-gradient(60% 60% at 35% 25%, rgba(255, 255, 255, 0.06), transparent 70%),
        var(--screen);
    }
    .tube span {
      display: flex; align-items: baseline;
      font: 900 clamp(1.125rem, 3.8dvh, 2rem)/1 var(--osd); letter-spacing: 0.02em; color: var(--phosphor);
      text-shadow: 0 0 14px rgba(150, 190, 255, 0.55), 0 0 2px #fff;
    }
    /* Doto's period reads as a plus sign: the version's dots are drawn instead. */
    .tube i {
      width: 0.16em; height: 0.16em; margin: 0 0.1em; border-radius: 50%;
      background: currentColor; box-shadow: 0 0 8px rgba(150, 190, 255, 0.7);
    }

    .intro { text-align: center; }
    .intro h1 { margin: 0; font-size: clamp(1.5rem, 4.4dvh, 2.25rem); line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; }

    .get { width: min(24rem, 100%); display: grid; gap: 0.25rem; justify-items: center; }
    .get .get-app { width: 100%; margin-bottom: 0.25rem; }
    .get .size { font-weight: 500; opacity: 0.65; }
    .get .alt { min-height: 2.25rem; display: inline-flex; align-items: center; padding: 0 0.5rem; border-radius: 8px; color: var(--muted); font-size: 0.875rem; text-underline-offset: 3px; }
    .get .alt:hover { color: var(--text); }
    .note, .empty-state { margin: 0; color: var(--muted); text-align: center; font-size: 0.875rem; text-wrap: balance; }

    .copy { width: min(30rem, 100%); display: grid; gap: 0.25rem; }
    .copy p { margin: 0; color: var(--muted); font-size: 0.9375rem; text-align: center; text-wrap: balance; }

    .more { position: relative; width: min(30rem, 100%); display: grid; justify-items: center; margin-top: -0.5rem; }
    .more summary {
      list-style: none; cursor: pointer; min-height: 2.75rem; padding: 0 0.75rem; border-radius: 999px;
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.875rem; font-weight: 600; color: var(--muted);
      transition: color 160ms ease, background-color 160ms ease;
    }
    .more summary::-webkit-details-marker { display: none; }
    .more summary::after {
      content: ""; width: 0.4rem; height: 0.4rem; margin-top: 0.15rem;
      border: solid currentColor; border-width: 2px 0 0 2px; transform: rotate(45deg);
      transition: transform 220ms var(--ease-out);
    }
    .more details[open] summary::after { margin-top: -0.15rem; transform: rotate(-135deg); }
    .more summary:hover, .more details[open] summary { color: var(--text); background: rgba(200, 212, 255, 0.08); }
    .rows {
      position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(100% + 0.5rem);
      max-height: min(24rem, 50dvh); overflow-y: auto; overscroll-behavior: contain;
      margin: 0; padding: 0.3rem 0.6rem; list-style: none; display: grid; gap: 0.15rem;
      border-radius: var(--r-md); background: #141c44; box-shadow: 0 0 0 1px var(--line), 0 24px 50px -16px rgba(0, 0, 0, 0.8);
    }
    .row {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.5rem 0.75rem;
      padding: 0.55rem 0.5rem; border-top: 1px solid var(--line);
    }
    .row:first-child { border-top: 0; }
    .row-name { display: grid; white-space: nowrap; }
    .row-name b { font-weight: 600; }
    .row-name small { color: var(--muted); font-size: 0.8125rem; }
    .row-links { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: end; }
    .chip {
      display: inline-flex; align-items: center; min-height: 2.25rem; padding: 0 0.85rem;
      border-radius: 999px; background: rgba(200, 212, 255, 0.1); color: var(--text);
      text-decoration: none; font-size: 0.875rem; font-weight: 600;
      transition: background-color 160ms ease, transform 120ms ease-out;
    }
    .chip:hover { background: rgba(200, 212, 255, 0.18); }
    .chip:active { transform: scale(0.95); transition-duration: 60ms; }
    @media (pointer: coarse) {
      .chip, .get .alt { min-height: 2.75rem; }
    }

    /* Short screens: the bubble only repeats the version, so it shrinks and then goes. */
    @media (max-height: 700px) {
      .bubble { width: 5.5rem; }
      .tube span { font-size: 1.0625rem; }
    }
    @media (max-height: 760px) and (max-width: 599px), (max-height: 600px) {
      .bubble { display: none; }
    }
    /* A phone on its side: what it is on one side, what it does with your data on the other. */
    @media (orientation: landscape) and (max-height: 600px) and (min-width: 620px) {
      .download {
        grid-template-columns: minmax(0, 20rem) minmax(0, 24rem); justify-content: center; align-items: center;
        column-gap: clamp(1.5rem, 5vw, 3rem); padding-block: max(3.25rem, env(safe-area-inset-top)) max(0.5rem, env(safe-area-inset-bottom));
      }
      .intro, .get { grid-column: 1; }
      .copy, .more { grid-column: 2; }
      .intro { grid-row: 1; }
      .get { grid-row: 2; }
      .copy { grid-row: 1; }
      .more { grid-row: 2; margin-top: 0; align-self: start; }
    }
    @media (prefers-reduced-motion: reduce) { .bubble { animation: fade 300ms ease both !important; } }
  </style>
</head>
<body>
  <a class="back" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Voltar</a>

  <main class="download">
    <div class="bubble" aria-hidden="true"><div class="tube"><span id="digits">----</span></div></div>

    <header class="intro">
      <h1>Telinha para computador</h1>
    </header>

    <div class="get" id="get" aria-live="polite"></div>

    <div class="copy">
      <p id="why">Menos atraso, mais qualidade e som do computador.</p>
      <p>O código é aberto e o Telinha não grava a transmissão.</p>
    </div>

    <section class="more" id="more" hidden aria-label="Outros downloads"></section>

    <a class="source-link" href="https://github.com/lexmarcos/telinha" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>Código aberto no GitHub
    </a>
    <p class="credit">Feito por <a href="https://markzuel.com/" target="_blank" rel="noopener noreferrer">Markzuel</a></p>
  </main>

<script type="module">
const $ = (id) => document.getElementById(id);
const OS = (() => {
  const p = (navigator.userAgentData?.platform || navigator.platform || "").toLowerCase();
  if (/android|iphone|ipad/i.test(navigator.userAgent)) return "phone";
  if (p.includes("win")) return "windows";
  if (p.includes("mac")) return "mac";
  if (p.includes("linux")) return "linux";
  return "other";
})();

// What each package is, in plain words. The first one of a system is its main download.
const PACKAGES = [
  { kind: "installer", os: "windows", label: "Baixar para Windows", short: "Windows" },
  { kind: "windows", os: "windows", label: "Versão portátil, sem instalar", short: "Windows portátil" },
  { kind: "appimage", os: "linux", label: "Baixar para Linux", short: "Linux (AppImage)" },
  { kind: "deb", os: "linux", label: "Pacote .deb para Ubuntu, Debian e Zorin", short: "Linux (.deb)" },
];

// On a phone the app is not an option, so what it adds would only get in the way.
$("why").hidden = OS === "phone";

const mb = (bytes) => `${Math.round(bytes / 1e6)} MB`;
const day = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
const href = (f) => `download/${f.file}`;

function link(cls, text, file, size) {
  const a = document.createElement("a");
  a.className = cls; a.href = href(file); a.download = "";
  a.append(text);
  if (size) { const s = document.createElement("span"); s.className = "size"; s.textContent = ` ${mb(file.size)}`; a.append(s); }
  return a;
}

function render(versions) {
  const latest = versions[0];
  $("digits").replaceChildren(...latest.version.split(".").flatMap((n, i) => (i ? [document.createElement("i"), n] : [n])));
  document.title = `Baixar o Telinha ${latest.version}`;
  const get = $("get");
  const mine = PACKAGES.filter((p) => p.os === OS && latest.files[p.kind]);

  if (mine.length) {
    const main = link("get-app", mine[0].label, latest.files[mine[0].kind], true);
    main.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    get.append(main);
    for (const p of mine.slice(1)) get.append(link("alt", p.label, latest.files[p.kind]));
  } else {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = OS === "phone"
      ? "No celular você não precisa do app. Abra o site e entre no canal."
      : OS === "mac"
        ? "Ainda não há versão para Mac. O site funciona no navegador."
        : "Escolha o seu sistema na lista abaixo.";
    get.append(note);
  }

  const more = $("more");
  const rows = versions.map((v, i) => ({
    name: `Versão ${v.version}`, sub: day(v.date),
    links: PACKAGES.filter((p) => v.files[p.kind] && (i === 0 ? p.kind !== mine[0]?.kind : p.os === OS || !mine.length)).map((p) => [p.short, v.files[p.kind]]),
  })).filter((r) => r.links.length);
  if (rows.length) more.append(group("Outros sistemas e versões", rows));
  more.hidden = !more.children.length;
}

function group(title, rows) {
  const d = document.createElement("details");
  const s = document.createElement("summary");
  s.textContent = title;
  const ul = document.createElement("ul");
  ul.className = "rows";
  for (const r of rows) {
    const li = document.createElement("li");
    li.className = "row";
    const name = document.createElement("div");
    name.className = "row-name";
    const b = document.createElement("b"); b.textContent = r.name;
    const small = document.createElement("small"); small.textContent = r.sub;
    name.append(b, small);
    const links = document.createElement("div");
    links.className = "row-links";
    for (const [text, file] of r.links) links.append(link("chip", text, file));
    li.append(name, links);
    ul.append(li);
  }
  d.append(s, ul);
  return d;
}

document.addEventListener("click", (e) => {
  for (const d of document.querySelectorAll(".more details[open]")) if (!d.contains(e.target)) d.open = false;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") for (const d of document.querySelectorAll(".more details[open]")) d.open = false;
});

try {
  const r = await fetch("download/versions.json", { cache: "no-cache" });
  if (!r.ok) throw new Error(r.status);
  const { versions } = await r.json();
  if (!versions?.length) throw new Error("empty");
  render(versions);
} catch {
  $("digits").textContent = "----";
  const p = document.createElement("p");
  p.className = "empty-state";
  p.textContent = "Este servidor ainda não tem o app. O site funciona no navegador.";
  $("get").append(p);
}
</script>
</body>
</html>
