# Template for /etc/turnserver.conf. The __FIELDS__ come from the .env on the VPS (see the README);
# the secret and the address are not kept in the repository.
listening-port=3478
tls-listening-port=5349
listening-ip=__PUBLIC_IP__
external-ip=__PUBLIC_IP__
min-port=49160
max-port=49999
realm=__TURN_HOST__

use-auth-secret
static-auth-secret=__TURN_SECRET__

fingerprint
no-cli
no-multicast-peers
no-tcp-relay
no-tlsv1
no-tlsv1_1

# Prevents anyone from using the relay to reach the VPS's internal network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Limits: ~12 Mbps per session. Each browser connection can reserve up to 3
# allocations (UDP, TCP, TLS) and the room is a mesh, so the allocation cap is
# generous; the temporary credentials already prevent use without going through the site.
max-bps=1500000
# allocations from browsers that closed without notice expire in 5 min (default is 10)
max-allocate-lifetime=300
total-quota=500

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

syslog
simple-log
