# Modelo do /etc/turnserver.conf. Os __CAMPOS__ vêm do .env na VPS (veja o README);
# o segredo e o endereço não ficam no repositório.
listening-port=3478
tls-listening-port=5349
listening-ip=__PUBLIC_IP__
external-ip=__PUBLIC_IP__
min-port=49160
max-port=49999
realm=__TURN_HOST__

use-auth-secret
static-auth-secret=__TURN_SECRET__

fingerprint
no-cli
no-multicast-peers
no-tcp-relay
no-tlsv1
no-tlsv1_1

# Não deixa ninguém usar o repasse para alcançar a rede interna da VPS.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Limites: ~12 Mbps por sessão. Cada conexão do navegador pode reservar até 3
# alocações (UDP, TCP, TLS) e a sala é uma malha, então o teto de alocações é
# folgado; as credenciais temporárias já impedem uso sem passar pelo site.
max-bps=1500000
# reservas de navegadores que fecharam sem avisar somem em 5 min (o padrão é 10)
max-allocate-lifetime=300
total-quota=500

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

syslog
simple-log
