# Joins the reverse proxy's existing network on the VPS (PROXY_NETWORK in .env),
# so it can reach the `telinha` service on port 9000.
services:
  telinha:
    build: .
    restart: unless-stopped
    env_file: .env # TURN_SECRET and TURN_HOST
    volumes:
      - ./public:/srv/public:ro
    mem_limit: 256m
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
