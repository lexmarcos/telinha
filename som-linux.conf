# Telinha: entrada virtual "Som do computador" = o que sai na saída de som padrão.
# Serve pro Chrome no Linux mandar o som junto ao compartilhar a tela inteira.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Som do computador"
      capture.props = {
        node.name = "telinha_som_capture"
        stream.capture.sink = true   # monitor da saída padrão (segue se ela mudar)
        node.passive = true
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "telinha_som"
        media.class = "Audio/Source"
        audio.position = [ FL FR ]
      }
    }
  }
]
