# Telinha: virtual input "Som do computador" = whatever plays on the default audio output.
# Lets Chrome on Linux send audio along when sharing the entire screen.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Som do computador"
      capture.props = {
        node.name = "telinha_som_capture"
        stream.capture.sink = true   # monitor of the default output (follows it if it changes)
        node.passive = true
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "telinha_som"
        media.class = "Audio/Source"
        audio.position = [ FL FR ]
      }
    }
  }
]
