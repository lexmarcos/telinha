# Prebuilt FFmpeg (BtbN, LGPL) downloaded by scripts/fetch-deps.sh.
# To build for Windows, the packaging script swaps FFMPEG_DIR.
[env]
FFMPEG_DIR = { value = ".deps/ffmpeg-linux", relative = true }
# PipeWire headers extracted from the .debs (scripts/fetch-deps.sh): Linux screen
# capture builds without installing development packages.
PKG_CONFIG_PATH = { value = ".deps/sysroot/usr/lib/x86_64-linux-gnu/pkgconfig", relative = true }
PKG_CONFIG_SYSROOT_DIR = { value = ".deps/sysroot", relative = true }

# Windows: statically linked C runtime (no Visual C++ Redistributable needed).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
